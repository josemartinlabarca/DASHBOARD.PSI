[pytest]
pythonpath = .
testpaths = tests
addopts = --strict-markers
markers =
    hash_real: la prueba verifica el hash scrypt real; desactiva el hash rápido de conftest.py (D-019)
    base_real: la prueba ejecuta el init_db real, sin la base de plantilla de conftest.py (D-031)
    token_aleatorio: la prueba necesita que cada sesión tenga un token CSRF distinto; no se le fuerza AGENDA_PSI_CSRF_TOKEN (D-038)
