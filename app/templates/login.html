{% extends "base.html" %}
{% block titulo %}Iniciar sesión · Agenda Psi{% endblock %}
{% block contenido %}
  <h1>Iniciar sesión</h1>
  <form method="post" action="{{ url_for('auth.login') }}" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}

    <p>
      <label for="email">Correo</label><br>
      <input type="text" inputmode="email" id="email" name="email" value="{{ email }}"
             maxlength="254" required autocomplete="email">
    </p>

    <p>
      <label for="password">Contraseña</label><br>
      <input type="password" id="password" name="password"
             maxlength="128" required autocomplete="current-password">
    </p>

    <p><button type="submit">Iniciar sesión</button></p>
  </form>
  <p><a href="{{ url_for('auth.registro') }}">Crear cuenta</a></p>
  <p><a href="{{ url_for('inicio') }}">Volver al inicio</a></p>
{% endblock %}
